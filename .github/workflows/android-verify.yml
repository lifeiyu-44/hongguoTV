name: Verify archived Android source
on:
  push:
    paths:
      - 'sources/hongguoTV/kotlin-tv/**'
      - '.github/workflows/android-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare upstream Windows line endings for Linux shell
        run: sed -i 's/\r$//' sources/hongguoTV/kotlin-tv/gradlew
      - name: Test, lint and build unchanged upstream source
        run: ./sources/hongguoTV/kotlin-tv/gradlew -p sources/hongguoTV/kotlin-tv :core:test :app:lintDebug :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-verification
          path: |
            sources/hongguoTV/kotlin-tv/core/build/reports/tests/test/
            sources/hongguoTV/kotlin-tv/app/build/reports/lint-results-debug.*
            sources/hongguoTV/kotlin-tv/app/build/outputs/apk/debug/*.apk
